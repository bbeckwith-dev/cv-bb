<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- LCP Image Preload (avatar = Largest Contentful Paint element) -->
    <link rel="preload" href="/foto-avatar-sm.webp" as="image" type="image/webp" imagesrcset="/foto-avatar-sm.webp 192w, /foto-avatar.webp 384w" imagesizes="(max-width: 768px) 160px, 192px" fetchpriority="high" />

    <!-- Font Preloads (self-hosted, eliminates Google Fonts CDN) -->
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Primary Meta Tags -->
    <title>Brent Beckwith | SOC Analyst & AI-Augmented Problem Solver</title>
    <meta name="title" content="Brent Beckwith | SOC Analyst & AI-Augmented Problem Solver" />
    <meta name="description" content="SOC analyst with 20+ years in enterprise IT. Linux admin, security operations, full-stack development. Uses AI daily to solve complex problems." />
    <meta name="author" content="Brent Beckwith" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Brent Beckwith | SOC Analyst & AI-Augmented Problem Solver" />
    <meta property="og:description" content="SOC analyst with 20+ years in enterprise IT. Linux admin, security operations, full-stack development. Uses AI daily to solve complex problems." />
    <meta property="og:image" content="/foto-avatar.webp" />
    <meta property="og:image:width" content="384" />
    <meta property="og:image:height" content="384" />
    <meta property="og:image:alt" content="Brent Beckwith" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Brent Beckwith | SOC Analyst & AI-Augmented Problem Solver" />
    <meta name="twitter:description" content="SOC analyst with 20+ years in enterprise IT. Linux admin, security operations, full-stack development. Uses AI daily to solve complex problems." />
    <meta name="twitter:image" content="/foto-avatar.webp" />
    <meta name="twitter:image:alt" content="Brent Beckwith" />

    <!-- Theme & App -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="msapplication-TileColor" content="#0a0a0a" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "#person",
          "name": "Brent Beckwith",
          "url": "https://linkedin.com/in/brent-beckwith",
          "image": "/foto-avatar.webp",
          "email": "brent.beckwith@gmail.com",
          "jobTitle": "SOC Analyst",
          "knowsAbout": [
            "Enterprise IT", "Linux Administration", "Security Operations",
            "LAMP Application Maintenance", "Python", "Bash", "PowerShell",
            "PHP", "SQL", "Perl", "DNS", "Apache", "Microsoft 365", "Intune",
            "AWS", "Azure", "Docker", "Fortinet", "NetApp",
            "AI Tools", "Claude", "Process Automation"
          ],
          "sameAs": [
            "https://linkedin.com/in/brent-beckwith",
            "https://github.com/bbeckwith-dev"
          ],
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Madison",
            "addressRegion": "OH",
            "addressCountry": "US"
          }
        }
      ]
    }
    </script>
    <!-- Theme detection before first paint (eliminates dark-to-light FOUC) -->
    <script>
      (function(){var s=localStorage.getItem('theme');var d=s?s==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;var h=document.documentElement;h.classList.toggle('dark',d);h.classList.toggle('light',!d);var m=document.querySelector('meta[name="color-scheme"]');if(m)m.content=d?'dark':'light';var t=document.querySelector('meta[name="theme-color"]');if(t)t.content=d?'#0a0a0a':'#ffffff'})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
